    namespace: google-cloud-pubsub
    baseUri: https://pubsub.googleapis.com/v1
    description: Google Cloud Pub/Sub API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_CLOUD_PUBSUB_TOKEN}}'
    resources:
    - name: projects-projectid-topics
      path: /projects/{projectId}/topics
      operations:
      - name: listtopics
        method: GET
        description: Google Cloud Pub/Sub List topics
        inputParameters:
        - name: projectId
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
